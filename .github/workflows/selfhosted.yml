name: Self Hosted Runner

on: push

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Display message
        run: echo "Hello from EC2"

      - name: Check machine
        run: hostname

      - name: Check OS
        run: uname -a

      - name: Check disk
        run: df -h
      - name: Create file on EC2
        run: echo "GitHub Actions executed this file on EC2" > /tmp/github-runner-test.txt

